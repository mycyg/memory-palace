name: MemoryPalace checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --frozen --extra dev --extra vector --extra graph
      - run: npm ci --prefix sdk/typescript && npm run build --prefix sdk/typescript
      - run: uv run pytest tests/business -q
      - run: git diff --check

  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen --extra dev --extra all
      - run: uv run pytest tests/test_extended.py -q

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen --extra dev
      - run: uv run pytest tests/clients -q
      - run: npm ci --prefix dsh-plugin && npm run typecheck --prefix dsh-plugin && npm test --prefix dsh-plugin && npm run build --prefix dsh-plugin
      - run: npm ci --prefix sdk/typescript && npm run build --prefix sdk/typescript && npm test --prefix sdk/typescript
      - run: uv run python scripts/generate_contract.py && npm run generate --prefix sdk/typescript
      - run: git diff --exit-code -- contracts src/eventmem/sdk sdk/typescript/src
      - run: npm ci --prefix console && npm run build --prefix console
      - run: npx --prefix console playwright install --with-deps chromium
      - run: npm test --prefix console
      - run: uv build
      - run: uv run python scripts/check_wheel.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-and-wheel
          path: |
            console/test-results
            dist/*.whl

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-docs.mjs
