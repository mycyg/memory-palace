name: Synthetic work memory benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run python scripts/benchmark_work_memory.py --output work-memory-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-memory-benchmark
          path: work-memory-benchmark.json
